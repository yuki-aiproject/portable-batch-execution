name: Execute wave

on:
  workflow_dispatch:
    inputs:
      wave_id:
        description: Planned wave identifier
        required: true
        type: string
      run_id:
        description: Opaque private run identifier (private mode only)
        required: false
        type: string
      private:
        description: Resolve the closed wave from the Private Data Plane
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  execute-wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
      - run: uv sync --dev --extra distilbert
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv run python -m portable_batch_execution.worker.execute_wave --wave-id "$PBE_WAVE_ID" --run-id "$PBE_RUN_ID" --mode "$PBE_MODE"
        env:
          PBE_WAVE_ID: ${{ inputs.wave_id }}
          PBE_RUN_ID: ${{ inputs.run_id }}
          PBE_MODE: ${{ inputs.private && 'private' || 'public' }}
          PBE_PRIVATE_DATA_PLANE_BASE_URL: ${{ inputs.private && secrets.PBE_PRIVATE_DATA_PLANE_BASE_URL || '' }}
          PBE_PRIVATE_DATA_PLANE_BEARER_TOKEN: ${{ inputs.private && secrets.PBE_PRIVATE_DATA_PLANE_BEARER_TOKEN || '' }}
