name: Execute wave

on:
  workflow_dispatch:
    inputs:
      wave_id:
        description: Planned wave identifier
        required: true
        type: string
      run_id:
        description: Opaque private run identifier (private/hf-direct mode only)
        required: false
        type: string
      private:
        description: Resolve the closed wave from the Private Data Plane
        required: false
        default: false
        type: boolean
      hf_direct:
        description: Private mode with artifact payloads routed directly to the HF bucket
        required: false
        default: false
        type: boolean
      hf_bucket:
        description: HF bucket identity for hf-direct mode (bounded owner/name metadata)
        required: false
        type: string
      hf_prefix:
        description: HF object prefix for hf-direct mode (bounded relative path metadata)
        required: false
        type: string
      hf_object_layout:
        description: HF object layout version for hf-direct mode
        required: false
        default: sha256-flat.v1
        type: string

permissions:
  contents: read

jobs:
  execute-wave:
    runs-on: ubuntu-latest
    env:
      PBE_WAVE_ID: ${{ inputs.wave_id }}
      PBE_RUN_ID: ${{ inputs.run_id }}
      PBE_MODE: ${{ inputs.hf_direct && 'hf-direct' || (inputs.private && 'private' || 'public') }}
      PBE_PRIVATE_DATA_PLANE_BASE_URL: ${{ (inputs.private || inputs.hf_direct) && secrets.PBE_PRIVATE_DATA_PLANE_BASE_URL || '' }}
      PBE_PRIVATE_DATA_PLANE_BEARER_TOKEN: ${{ (inputs.private || inputs.hf_direct) && secrets.PBE_PRIVATE_DATA_PLANE_BEARER_TOKEN || '' }}
      PBE_HF_BUCKET: ${{ inputs.hf_direct && inputs.hf_bucket || '' }}
      PBE_HF_PREFIX: ${{ inputs.hf_direct && inputs.hf_prefix || '' }}
      PBE_HF_OBJECT_LAYOUT: ${{ inputs.hf_direct && inputs.hf_object_layout || '' }}
      HF_SYSTEM_TRADING_DATA_RW_TOKEN: ${{ inputs.hf_direct && secrets.HF_SYSTEM_TRADING_DATA_RW_TOKEN || '' }}
      HF_TOKEN: ${{ inputs.hf_direct && secrets.HF_SYSTEM_TRADING_DATA_RW_TOKEN || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
      - name: Install base dependencies only
        run: uv sync --no-dev
      - name: Install pinned huggingface_hub for hf-direct
        if: env.PBE_MODE == 'hf-direct'
        run: uv sync --no-dev --extra hf-direct
      - name: Resolve runtime profile
        id: profile
        run: |
          if [ "$PBE_MODE" = "hf-direct" ]; then
            PROFILE="$(uv run --no-sync python -m portable_batch_execution.worker.runtime_profile --wave-id "$PBE_WAVE_ID" --run-id "$PBE_RUN_ID" --mode hf-direct)"
          elif [ "$PBE_MODE" = "private" ]; then
            PROFILE="$(uv run --no-sync python -m portable_batch_execution.worker.runtime_profile --wave-id "$PBE_WAVE_ID" --run-id "$PBE_RUN_ID" --mode private)"
          else
            PROFILE="$(uv run --no-sync python -m portable_batch_execution.worker.runtime_profile --wave-id "$PBE_WAVE_ID" --mode public)"
          fi
          echo "resolved runtime profile: $PROFILE"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
      - name: Install tabular dependencies
        if: steps.profile.outputs.profile == 'tabular'
        run: |
          if [ "$PBE_MODE" = "hf-direct" ]; then
            uv sync --no-dev --extra tabular --extra hf-direct
          else
            uv sync --no-dev --extra tabular
          fi
      - name: Install ml dependencies
        if: steps.profile.outputs.profile == 'ml'
        run: |
          if [ "$PBE_MODE" = "hf-direct" ]; then
            uv sync --no-dev --extra ml --extra hf-direct
          else
            uv sync --no-dev --extra ml
          fi
      - name: Install distilbert dependencies
        if: steps.profile.outputs.profile == 'distilbert'
        run: |
          if [ "$PBE_MODE" = "hf-direct" ]; then
            uv sync --no-dev --extra distilbert --extra hf-direct
          else
            uv sync --no-dev --extra distilbert
          fi
      - name: Install FFmpeg
        if: steps.profile.outputs.profile == 'media'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv run --no-sync python -m portable_batch_execution.worker.execute_wave --wave-id "$PBE_WAVE_ID" --run-id "$PBE_RUN_ID" --mode "$PBE_MODE"
